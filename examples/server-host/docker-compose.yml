services:
  geyser:
    image: ${GEYSER_IMAGE:?set GEYSER_IMAGE to a Geyser image containing this extension}
    restart: unless-stopped
    environment:
      NETHERNET_SIGNALLING_MODE: provider
      NETHERNET_PROVIDER_URL: https://signal.host.example
      NETHERNET_PROVIDER_PROFILE: warden-admission-v1
      NETHERNET_PROVIDER_REGISTRATION_MODE: new-service
      NETHERNET_PROVIDER_AUTHORIZATION: bearer-token
      NETHERNET_PROVIDER_TOKEN_FILE: /run/secrets/provider-token
      NETHERNET_PROVIDER_REGION: EU
      NETHERNET_PROVIDER_POOL: customers
      NETHERNET_PROVIDER_TAGS: '{"product":"minecraft","plan":"standard"}'
      NETHERNET_PROVIDER_STATE_DIRECTORY: /var/lib/nethernet/provider-state
    secrets:
      - provider-token
    volumes:
      - provider-state:/var/lib/nethernet
    ports:
      - 19132:19132/udp
      - 19133:19133/udp
secrets:
  provider-token:
    file: ./customer-provider-token
volumes:
  provider-state:
