name: Provider extension
on:
  push:
    branches: [codex/registration-provider]
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871
        with:
          path: GeyserNetherNet
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871
        with:
          repository: teamziax/NetworkCompatible
          ref: 12d62eaf993b69d4370bb65b3ba39a0fd132852a
          path: NetworkCompatible
      - uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@d156388eb19639ec20ade50009f3d199ce1e2808
      - run: bash gradlew build -PregistrationRevision=${{ github.sha }} --console=plain
        working-directory: GeyserNetherNet
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: GeyserNetherNet-registration-${{ github.sha }}
          path: |
            GeyserNetherNet/build/libs/*.jar
            GeyserNetherNet/build/test-results/test/*.xml
          if-no-files-found: error
